[project]
name = "kv-events-agent"
version = "1.0.0"
description = "Klang Valley & Online Tech/Business Events Calendar"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "sqlalchemy>=2.0.0",
    "httpx>=0.26.0",
    "beautifulsoup4>=4.12.0",
    "playwright>=1.41.0",
    "icalendar>=5.0.0",
    "apscheduler>=3.10.0",
    "pyyaml>=6.0.0",
    "pydantic>=2.5.0",
    "python-dateutil>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"