<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KV Events Discovery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
      :root {
        --color-ai: #3B82F6;
        --color-cyber: #EF4444;
        --color-blockchain: #8B5CF6;
        --color-investment: #22C55E;
        --color-entrepreneur: #F97316;
        --color-virtual: #06B6D4;
        --color-tech: #6B7280;
      }
      body { background: #f8f9fa; }
      .fc .fc-event {
        cursor: pointer;
        border: none;
        color: #fff !important;
        font-weight: 500;
      }
      .fc .fc-daygrid-event {
        padding: 2px 6px;
        font-size: 0.75rem;
        border-radius: 3px;
      }
      .fc .fc-daygrid-event .fc-event-title {
        color: #fff !important;
        font-weight: 500;
      }
      .fc .fc-daygrid-event .fc-event-time {
        color: rgba(255,255,255,0.9) !important;
      }
      .fc .fc-daygrid-dot-event .fc-event-title {
        color: #1f2937 !important;
        font-weight: 500;
      }
      .event-ai { background: var(--color-ai) !important; }
      .event-cybersecurity { background: var(--color-cyber) !important; }
      .event-blockchain { background: var(--color-blockchain) !important; }
      .event-investment { background: var(--color-investment) !important; }
      .event-entrepreneurship { background: var(--color-entrepreneur) !important; }
      .event-tech { background: var(--color-tech) !important; }
      .virtual-badge { background: var(--color-virtual); color: white; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; }
      /* Calendar header and day cells */
      .fc .fc-col-header-cell { background: #f1f5f9; }
      .fc .fc-col-header-cell-cushion { color: #374151; font-weight: 600; text-decoration: none; }
      .fc .fc-daygrid-day-number { color: #374151; text-decoration: none; font-weight: 500; }
      .fc .fc-daygrid-day.fc-day-today { background: #FEF9C3 !important; }
      .fc .fc-more-link { color: #6B7280; font-weight: 600; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script data-goatcounter="https://ai-eventscraper.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
  </body>
</html>
