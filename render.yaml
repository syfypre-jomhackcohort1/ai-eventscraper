services:
  - type: web
    name: kv-events-agent
    runtime: python
    buildCommand: |
      pip install -r requirements.txt
      python -m playwright install --with-deps chromium
      cd frontend && npm install && npm run build
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      # Set the following in Render's dashboard (do not commit values).
      # Each key is OPTIONAL - the app boots and runs without any of them;
      # the corresponding scrapers go into a no-op fallback.
      - key: IG_BACKEND
        sync: false  # set to "apify" or "hikerapi" in dashboard
      - key: APIFY_TOKEN
        sync: false
      - key: HIKERAPI_KEY
        sync: false
      - key: LLM_PROVIDER
        sync: false  # set to "gemini" or "openai" in dashboard
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
